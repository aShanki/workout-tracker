version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017/fitness_tracker
      - MONGO_DB_NAME=fitness_tracker
      - JWT_SECRET=${JWT_SECRET:-your_secure_jwt_secret_here_please_change_in_production}
      - JWT_EXPIRATION=24h
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
    networks:
      - workout_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - api
    networks:
      - workout_network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=fitness_tracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - workout_network

volumes:
  mongodb_data:
  node_modules:
  go_modules:

networks:
  workout_network:
    driver: bridge